<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Audio Stream Test</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #121212; color: #fff; }
        audio { outline: none; margin-top: 20px; }
        h1 { color: #00ff88; }
    </style>
</head>
<body>
    <h1>Live Audio Pipeline Stream</h1>
    <p>Waiting for the stream to begin...</p>
    
    <!-- The Audio Player -->
    <audio id="live-audio" controls autoplay></audio>

    <script>
      var audio = document.getElementById('live-audio');
      var streamUrl = 'http://127.0.0.1:8080/stream.m3u8';

      if (Hls.isSupported()) {
        var hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(audio);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          audio.play();
          document.querySelector('p').innerText = "Stream loaded! Press play if it doesn't auto-start.";
        });
        hls.on(Hls.Events.ERROR, function(event, data) {
            if(data.fatal) {
                console.log("HLS Error:", data);
            }
        });
      } 
      else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
        audio.src = streamUrl;
        audio.addEventListener('loadedmetadata', function() {
          audio.play();
          document.querySelector('p').innerText = "Stream loaded! Press play if it doesn't auto-start.";
        });
      }
    </script>
</body>
</html>
